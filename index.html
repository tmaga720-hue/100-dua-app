<style>

</style></head><body><main class="app"><header class="top"><small>КАРМАННАЯ КНИГА</small><h1>100 дуа<br>из Корана и Сунны</h1><p>Читай, открывай и сохраняй полезные молитвы</p></header><nav class="menu"><button class="tile" onclick="show('read')"><b>📖</b>Читать дуа</button><button class="tile" onclick="show('about')"><b>☘</b>О приложении</button><button class="tile" onclick="openPdf()"><b>⬇</b>Открыть PDF</button><button class="tile" onclick="show('install')"><b>＋</b>На главный экран</button></nav><section class="section" id="content"><h2>Добро пожаловать</h2><div class="panel">Это приложение содержит книгу «100 дуа из Корана и пречистой Сунны». Нажми «Читать дуа», чтобы открыть книгу прямо здесь.</div></section><footer>Зелёный дизайн · Работает с приложенным PDF</footer></main>

function openPdf(){window.open('duas.pdf','_blank')}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
